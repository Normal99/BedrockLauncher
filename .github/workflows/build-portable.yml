name: Build Portable

# Produces a self-contained build that runs without installing the .NET Desktop Runtime.
# - Any push: the build is uploaded as a workflow artifact (needs a GitHub login to download).
# - Pushes to the portable branch, or a tag named portable-*: the zip is also published as a
#   GitHub Release, which anyone can download without a GitHub account.
# Unzip it anywhere (e.g. Documents or a USB stick) and run BedrockLauncher.exe.

on:
  workflow_dispatch:
  push:
    branches: '**'
    tags: 'portable-*'

permissions:
  contents: write

jobs:
  # Each build runs on its own fresh runner: PostSharp fails with a license error
  # when it compiles the project a second time on the same machine.
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: BedrockLauncher-portable-win-x64
            self-contained: true
          - name: BedrockLauncher-win-x64
            self-contained: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --remote --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (win-x64, self-contained ${{ matrix.self-contained }})
        run: dotnet publish BedrockLauncher/BedrockLauncher.csproj --configuration Release --runtime win-x64 --self-contained ${{ matrix.self-contained }} --output out/${{ matrix.name }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}

  release:
    needs: build
    if: github.ref == 'refs/heads/claude/portable-windows-no-admin-wz9yh4' || startsWith(github.ref, 'refs/tags/portable-')
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Zip builds
        working-directory: out
        run: |
          zip -qr BedrockLauncher-portable-win-x64.zip BedrockLauncher-portable-win-x64
          zip -qr BedrockLauncher-win-x64.zip BedrockLauncher-win-x64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('portable-v{0}', github.run_number) }}
          name: BedrockLauncher Portable (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/BedrockLauncher-portable-win-x64.zip
            out/BedrockLauncher-win-x64.zip
          body: |
            Builds of BedrockLauncher for 64-bit Windows. Neither needs admin rights to run.

            - `BedrockLauncher-portable-win-x64.zip` includes .NET, so nothing needs to be installed.
            - `BedrockLauncher-win-x64.zip` is smaller and uses the .NET 8 Desktop Runtime already on the PC, including one installed for your user only with `DOTNET_ROOT` set (see docs/PORTABLE.md, option 2).

            1. Download one of the zips below.
            2. Right-click it, then **Extract All** to a folder you can write to, such as `Documents`.
            3. Open the extracted folder and run `BedrockLauncher.exe`. With `BedrockLauncher-win-x64.zip` you can instead start it from that folder with `"%LOCALAPPDATA%\Microsoft\dotnet\dotnet.exe" BedrockLauncher.dll`.

            If SmartScreen blocks it, click **More info** then **Run anyway**. If that button is missing, right-click the downloaded zip, choose **Properties**, tick **Unblock**, click **OK**, and extract it again.

            Windows Developer Mode still has to be on to install most Minecraft versions, and turning it on needs admin once. See [docs/PORTABLE.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/PORTABLE.md).
